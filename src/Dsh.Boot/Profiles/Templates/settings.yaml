# DeepSeek Harness 配置文件模板（settings.yaml v2）
# 编辑此文件会影响全新安装首次启动时生成的默认 settings.yaml。

# DeepSeek Harness 配置文件（settings.yaml v2）
# 本文件由 DSH 首次启动时自动生成，可手动编辑。

# 全局默认模型，格式为 provider/model
global_default_model: deepseek-official/deepseek-v4-flash

# 压缩（compaction）使用的模型，格式为 provider/model
compaction_model: deepseek-official/deepseek-v4-flash

# 子代理默认模型，格式为 provider/model
subagent:
  default_model: deepseek-official/deepseek-v4-flash

# LLM 提供方配置:type 缺省即 openai-compatible;要用 DeepSeek 专属行为(缓存 token 统计等)需显式 type: deepseek
# 适配器由插件提供:@deepseek-ai/dsh-llm-openai(openai-compatible/openai-responses)、-anthropic、-deepseek
# 未配置 key 的 provider 会被跳过并记 WARN;完全不配 provider 也能启动,首次发起请求时才报错
providers:
  deepseek-official:
    type: openai-compatible
    options:
      baseUrl: https://api.deepseek.com
      # 也可以用 apiKey 直接内联;留空或未设置环境变量时该 provider 会被跳过并记 WARN
      apiKeyEnv: DEEPSEEK_API_KEY
    models:
      deepseek-v4-flash:
        name: DeepSeek V4 Flash
        reasoning: true
        tool_call: true
      deepseek-v4-pro:
        name: DeepSeek V4 Pro
        reasoning: true
        tool_call: true

# 技能目录
skills:
  paths: []
  urls: []

# 全局规则
rules: []

# 插件开关:true/false 或 {enabled: true, ...插件参数}
# 插件发现即启用;只有这里显式禁用的插件才会关闭。/plugins 命令会改写本段。
plugins: {}

# MCP 服务器
mcp:
  filesystem:
    transport: stdio
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem"]
    args: []
    url: null
    enabled: true

# 项目记忆开关（/memory on|off）
memory:
  enabled: false
  # file: .dsh-memory.md

# 自动压缩选项
compaction:
  auto: true
  prune: true

# 快照恢复点(shadow git,默认关闭)
checkpoints:
  enabled: false
  max_points: 256
  keep_days: 15

# 日志
logging:
  # 最低级别:trace | debug | info | warn | error | off
  level: info
  # 内存缓冲条数(供 TUI 与启动失败聚合读取)
  buffer_size: 1000
  # 是否同时输出到控制台(TUI 下强制关闭)
  console: false
  # 写入 <home>/logs/dsh-YYYYMMDD.log
  file: true
  # 单文件上限(MB),超出后切分 .1/.2…
  file_max_mb: 32
  # 文件保留天数
  keep_days: 15

# 安全设置
safety:
  autoApprove: false
  blacklist: []
